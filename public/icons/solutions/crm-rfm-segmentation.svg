<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  {/* RFM Tier Matrix Grid */}
  <rect x="8" y="8" width="32" height="32" rx="3" fill="#FFF5F4" stroke="#121212" stroke-width="2.2" />
  <line x1="8" y1="24" x2="40" y2="24" stroke="#121212" stroke-width="1.8" />
  <line x1="24" y1="8" x2="24" y2="40" stroke="#121212" stroke-width="1.8" />
  
  {/* Quadrant 1: Champions / High RFM VIPs (Top Right) */}
  <rect x="24" y="8" width="16" height="16" fill="#D83427" fill-opacity="0.15" />
  <circle cx="32" cy="16" r="4.5" fill="#D83427" />
  <circle cx="32" cy="16" r="2" fill="white" />
  
  {/* Quadrant 2: Potential Loyalists (Top Left) */}
  <circle cx="16" cy="16" r="3" fill="#121212" />
  
  {/* Quadrant 3: At-Risk / Churn Defense (Bottom Right) */}
  <circle cx="32" cy="32" r="3.5" fill="#FFF5F4" stroke="#D83427" stroke-width="2" />
  <circle cx="32" cy="32" r="1.5" fill="#D83427" />
  
  {/* Quadrant 4: Inactive Dormant (Bottom Left) */}
  <circle cx="16" cy="32" r="2.5" fill="#94A3B8" />
</svg>